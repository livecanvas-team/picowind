# Builds and deploys the theme.
name: Deploy the theme

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  # See https://github.com/composer/composer/issues/9368#issuecomment-718112361
  COMPOSER_ROOT_VERSION: "dev-main"

jobs:
  release:
    if: github.repository == 'livecanvas-team/picowind'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The release tag must be a semantic version such as 0.1.0 or v0.1.0." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Extract release notes
        id: changelog
        shell: bash
        run: |
          {
            echo "content<<EOF"
            node deploy/extract-changelog.mjs "$VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update WordPress.org changelog
        run: node deploy/update-readme-changelog.mjs

      - name: Prepare source for scoping
        shell: bash
        run: |
          mkdir -p picowind-deploy
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='vendor' \
            --exclude='picowind-deploy' \
            --exclude='picowind-prefixed' \
            --exclude='picowind-*-prefixed' \
            --exclude='dist-branch' \
            ./ picowind-deploy/

          composer install \
            --working-dir=picowind-deploy \
            --no-dev \
            --classmap-authoritative \
            --no-interaction \
            --prefer-dist \
            --ansi

      - name: Apply Composer compatibility workaround
        shell: bash
        run: |
          rm -f \
            picowind-deploy/vendor/symfony/cache/Traits/Redis5Proxy.php \
            picowind-deploy/vendor/symfony/cache/Traits/RedisCluster5Proxy.php

          composer dump-autoload \
            --working-dir=picowind-deploy \
            --classmap-authoritative \
            --no-dev \
            --ansi

      - name: Build scoped artifact
        run: bash deploy/deploy-scoped.sh picowind-deploy picowind-prefixed

      - name: Apply .distignore filter
        shell: bash
        run: |
          mkdir -p picowind-final
          rsync -a \
            --exclude='.*' \
            --exclude-from=.distignore \
            picowind-prefixed/ \
            picowind-final/
          rm -rf picowind-prefixed
          mv picowind-final picowind-prefixed

      - name: Verify release artifact
        shell: bash
        run: |
          artifact=picowind-prefixed

          grep -Fq "Version: ${VERSION}" "$artifact/style.css"
          grep -Fq "Stable tag: ${VERSION}" "$artifact/readme.txt"
          test -f "$artifact/vendor/autoload.php"
          test ! -e "$artifact/deploy"
          test ! -e "$artifact/resources"
          test ! -e "$artifact/vite.config.ts"

      - name: Publish build to dist branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-branch
          cd dist-branch
          git fetch origin dist || true
          git checkout dist 2>/dev/null || git checkout --orphan dist
          git rm -rf . 2>/dev/null || true
          git clean -fxd
          cp -a ../picowind-prefixed/. .
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "The dist branch already matches Picowind ${VERSION}."
          else
            git commit -m "Build Picowind ${VERSION}"
            git push origin dist
          fi

      - name: Create theme archive
        shell: bash
        run: |
          mkdir -p picowind-zip/picowind
          cp -a picowind-prefixed/. picowind-zip/picowind/
          (cd picowind-zip && zip -qr "../picowind-${VERSION}.zip" picowind -x "*.git*" "*.DS_Store*")

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: picowind-${{ steps.version.outputs.value }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
